name: Build

# Builds the desktop receiver for Linux (AppImage), Windows (installer and
# zip) and macOS (disk image), and the Android sender (APK), with the same Qt
# the project is developed with, and keeps the packages as artifacts.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.11.2"
  # Qt 6.11's Windows packages moved to a per-compiler repository layout that
  # aqtinstall 3.3 can't read yet; 6.10 has the same FFmpeg 7.1 and the Qt
  # features beamr needs (6.8+). Move up once aqtinstall catches up.
  QT_VERSION_WINDOWS: "6.10.3"
  # Keep in step with the NDK Qt was built with.
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libpulse0 libfuse2t64

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build

      - name: AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/receiver-desktop/qml
          EXTRA_QT_MODULES: svg
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-qt $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          mkdir -p AppDir/usr/bin AppDir/usr/share/doc/beamr
          cp build/receiver-desktop/beamr-receiver AppDir/usr/bin/
          cp -r LICENSE THIRD_PARTY_NOTICES.md licenses AppDir/usr/share/doc/beamr/
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --desktop-file receiver-desktop/platform/beamr.desktop \
            --icon-file receiver-desktop/platform/beamr.png
          mv beamr*.AppImage beamr-receiver-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: beamr-receiver-linux-x86_64
          path: beamr-receiver-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      # Qt ships FFmpeg as DLLs only; MSVC links through import libraries,
      # so make them from the DLLs' exports.
      - name: FFmpeg import libraries
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force ffmpeg-lib
          foreach ($name in "avcodec", "avformat", "avutil") {
            $dll = Get-ChildItem "$env:QT_ROOT_DIR\bin\$name-*.dll" | Select-Object -First 1
            if (-not $dll) { throw "$name DLL not found in $env:QT_ROOT_DIR\bin" }
            $exports = dumpbin /nologo /exports $dll.FullName |
              Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
            Set-Content "$out\$name.def" (@("LIBRARY $($dll.Name)", "EXPORTS") + $exports)
            lib /nologo /def:"$out\$name.def" /out:"$out\$name.lib" /machine:x64
          }
          "FFMPEG_LIB_DIR=$($out.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" -DBEAMR_FFMPEG_LIB_DIR="%FFMPEG_LIB_DIR%"
          cmake --build build
        shell: cmd

      - name: Package
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force beamr-receiver
          # Qt's project setup puts Windows executables in the build root.
          $exe = Get-ChildItem build -Recurse -Filter beamr-receiver.exe | Select-Object -First 1
          if (-not $exe) { throw "beamr-receiver.exe not built" }
          Copy-Item $exe.FullName $dist
          windeployqt --release --qmldir receiver-desktop\qml "$dist\beamr-receiver.exe"
          # beamr links FFmpeg directly, not only through Qt's media plugin.
          Copy-Item "$env:QT_ROOT_DIR\bin\av*.dll", "$env:QT_ROOT_DIR\bin\sw*.dll" $dist -ErrorAction SilentlyContinue
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $dist
          Copy-Item -Recurse licenses $dist

      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          & makensis /V2 /DVERSION=$version "/DSOURCE=$PWD\beamr-receiver" `
            "/DOUTFILE=$PWD\beamr-receiver-windows-x64-setup.exe" packaging\windows\beamr.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: beamr-receiver-windows-x64
          path: beamr-receiver
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: beamr-receiver-windows-x64-setup
          path: beamr-receiver-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Build
        run: |
          brew install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build

      # Unsigned: macOS asks people to confirm opening it the first time
      # (right-click > Open). Signing needs an Apple Developer ID.
      - name: Disk image
        run: |
          app=$(find build -name 'beamr-receiver.app' -maxdepth 3 | head -n 1)
          test -n "$app" || { echo "no app bundle"; exit 1; }
          cp -R LICENSE THIRD_PARTY_NOTICES.md licenses "$app/Contents/Resources/"
          "$QT_ROOT_DIR/bin/macdeployqt" "$app" -qmldir=receiver-desktop/qml -dmg -always-overwrite
          mv "${app%.app}.dmg" beamr-receiver-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: beamr-receiver-macos-arm64
          path: beamr-receiver-macos-arm64.dmg
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION" > /dev/null

      # Installs Qt for Android plus the matching desktop Qt its tools run on.
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Build
        run: |
          host_qt="$(dirname "$QT_ROOT_DIR")/gcc_64"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$host_qt" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          cmake --build build --target apk

      # Test builds: signed with a key made for this run only, so the APK
      # installs, but each one must replace the last by uninstalling it.
      # Releases get the project's own key.
      - name: Sign for testing
        run: |
          tools="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS"
          apk=$(find build -name '*release-unsigned.apk' | head -n 1)
          test -n "$apk" || { echo "no unsigned APK built"; find build -name '*.apk'; exit 1; }
          keytool -genkeypair -keystore ci.jks -storepass android -keypass android -alias ci \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=beamr CI" -noprompt
          "$tools/zipalign" -f -p 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks ci.jks --ks-pass pass:android --ks-key-alias ci \
            --out beamr-android-arm64-test.apk aligned.apk
          "$tools/apksigner" verify beamr-android-arm64-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: beamr-android-arm64-test
          path: beamr-android-arm64-test.apk
          if-no-files-found: error
